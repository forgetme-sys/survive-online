<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Discute avec ton prof IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F2;
    --paper-line:#DDE3EC;
    --margin-red:#C65B4E;
    --ink:#22303F;
    --ink-soft:#5B6B7C;
    --pen:#2B4C7E;
    --pen-dark:#1C3559;
    --bubble-ai:#FFFFFF;
    --bubble-user:#EAF1FB;
    --border:#E4E0D3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);}
  .wrap{max-width:720px;margin:0 auto;padding:32px 24px 24px;display:flex;flex-direction:column;height:100vh;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pen);font-weight:600;margin:0 0 4px;}
  h1{font-family:'Caveat',cursive;font-size:38px;font-weight:700;margin:0 0 2px;color:var(--pen-dark);line-height:1;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}

  .chat-area{
    flex:1;
    overflow-y:auto;
    background:
      repeating-linear-gradient(var(--paper) 0 31px, var(--paper-line) 31px 32px);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px 20px 16px 40px;
    position:relative;
    min-height:280px;
    max-height:60vh;
  }
  .chat-area::before{
    content:"";
    position:absolute; left:22px; top:0; bottom:0; width:1px;
    background:var(--margin-red); opacity:.5;
  }
  .msg{
    max-width:82%;
    margin:0 0 14px;
    padding:10px 14px;
    border-radius:10px;
    font-size:15px;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .msg.ai{
    background:var(--bubble-ai);
    border:1px solid var(--border);
    margin-right:auto;
  }
  .msg.user{
    background:var(--bubble-user);
    color:var(--pen-dark);
    margin-left:auto;
  }
  .empty-hint{color:var(--ink-soft); font-size:14px; padding:8px 4px;}

  .typing{display:none; align-items:center; gap:8px; color:var(--ink-soft); font-size:13px; margin:2px 0 12px;}
  .typing.show{display:flex;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--pen);animation:bl 1s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.15s;}
  .dot:nth-child(3){animation-delay:.3s;}
  @keyframes bl{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .composer{display:flex; gap:8px; margin-top:14px;}
  textarea#msgInput{
    flex:1; resize:none; min-height:44px; max-height:120px;
    border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    font-family:'Inter',sans-serif; font-size:15px; color:var(--ink); background:#fff;
    outline:none;
  }
  textarea#msgInput:focus{border-color:var(--pen);}
  button#sendBtn{
    height:44px; padding:0 20px; border:none; border-radius:8px; cursor:pointer;
    background:var(--pen); color:#fff; font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
  }
  button#sendBtn:hover{background:var(--pen-dark);}
  button#sendBtn:disabled{background:#B9C3D0; cursor:default;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">discussion</p>
  <h1>Ton prof IA</h1>
  <p class="sub">Pose une question sur un cours, un exercice, une notion que tu ne comprends pas — il t'explique simplement.</p>

  <div class="chat-area" id="chatArea">
    <p class="empty-hint">Ex : "Explique-moi la photosynthèse" ou "Je ne comprends pas le théorème de Pythagore"</p>
  </div>
  <div class="typing" id="typingRow"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <div class="composer">
    <textarea id="msgInput" placeholder="Écris ta question ici..."></textarea>
    <button id="sendBtn">Envoyer</button>
  </div>
  <p class="hint">Entrée pour envoyer, Maj+Entrée pour aller à la ligne</p>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const typingRow = document.getElementById('typingRow');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

let history = [];
let hintCleared = false;

function addBubble(role, text){
  if(!hintCleared){
    chatArea.innerHTML = '';
    hintCleared = true;
  }
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function sendMessage(){
  const text = msgInput.value.trim();
  if(!text) return;

  addBubble('user', text);
  history.push({ role: 'user', content: text });
  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendBtn.disabled = true;
  typingRow.classList.add('show');
  chatArea.scrollTop = chatArea.scrollHeight;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: "Tu es un professeur patient qui explique des notions de cours (collège/lycée) de façon simple, claire et encourageante, en français. Utilise des exemples concrets quand c'est utile. Réponds de façon concise mais complète, pas de markdown, texte simple.",
        messages: history
      })
    });

    if(!response.ok) throw new Error('network');

    const data = await response.json();
    const replyText = data.content.map(b => b.type === 'text' ? b.text : '').join('');

    addBubble('ai', replyText);
    history.push({ role: 'assistant', content: replyText });
  }catch(err){
    addBubble('ai', "Une erreur s'est produite. Réessaie dans un instant.");
  }finally{
    sendBtn.disabled = false;
    typingRow.classList.remove('show');
  }
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
