<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ARC-9 // Unité Conversationnelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e14;
    --panel: #10161f;
    --panel-2: #0d1219;
    --line: #1e2a38;
    --cyan: #5eead4;
    --amber: #f2a65a;
    --text: #dbe6ec;
    --muted: #5c7085;
    --danger: #ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 20% -10%, rgba(94,234,212,0.06), transparent 40%),
      radial-gradient(circle at 100% 110%, rgba(242,166,90,0.05), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
  }
  .app{
    max-width: 720px; margin: 0 auto; height:100vh;
    display:flex; flex-direction:column;
    padding: 18px 16px 16px;
  }

  /* HUD header */
  .hud{
    position:relative;
    border:1px solid var(--line);
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    padding: 16px 18px;
    display:flex; align-items:center; gap:16px;
  }
  .hud::before, .hud::after{
    content:""; position:absolute; width:10px; height:10px;
    border: 1.5px solid var(--cyan); opacity:0.8;
  }
  .hud::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .hud::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .core-wrap{ position:relative; width:52px; height:52px; flex-shrink:0; }
  .core-wrap svg{ width:100%; height:100%; display:block; }
  .ring{ transform-origin: 50% 50%; }
  .ring1{ animation: spin 6s linear infinite; }
  .ring2{ animation: spin 4s linear infinite reverse; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .core-dot{ fill: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }

  .hud-title{ flex:1; min-width:0; }
  .hud-title .name{
    font-family:'Orbitron', sans-serif; font-weight:900; letter-spacing:2px;
    font-size: 20px; color: var(--text);
  }
  .hud-title .status{
    font-size: 11px; color: var(--cyan); letter-spacing: 1px; margin-top: 3px;
    display:flex; align-items:center; gap:6px;
  }
  .dot-pulse{
    width:6px; height:6px; border-radius:50%; background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }

  .hud-meta{
    text-align:right; font-size:10px; color: var(--muted); line-height:1.6;
    letter-spacing: 0.5px;
  }

  .code-btn{
    flex-shrink:0;
    font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:1.5px;
    font-size: 11px; color: var(--cyan); background: transparent;
    border:1px solid var(--cyan); padding: 8px 12px; cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .code-btn:hover{ background: var(--cyan); color: var(--bg); }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(5,8,12,0.75);
    display:none; align-items:center; justify-content:center; z-index:100;
    padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    width:100%; max-width: 640px; max-height: 85vh;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--cyan);
    display:flex; flex-direction:column;
    position:relative;
  }
  .modal::before, .modal::after{
    content:""; position:absolute; width:12px; height:12px;
    border: 1.5px solid var(--amber); opacity:0.9;
  }
  .modal::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .modal::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px; border-bottom:1px solid var(--line);
  }
  .modal-head .name{
    font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:1.5px;
    font-size:13px; color: var(--cyan);
  }
  .modal-close{
    background:none; border:none; color: var(--muted); font-size:18px;
    cursor:pointer; line-height:1; padding:2px 6px;
  }
  .modal-close:hover{ color: var(--danger); }
  .modal-body{ padding: 16px; display:flex; flex-direction:column; gap:12px; flex:1; overflow:hidden; }
  .modal-body label{ font-size:10.5px; color: var(--muted); letter-spacing:1px; }
  #codeArea{
    flex:1; min-height: 220px; resize: vertical;
    background: rgba(5,8,12,0.6); border:1px solid var(--line);
    color: var(--text); font-family:'JetBrains Mono', monospace; font-size:12.5px;
    padding: 12px; outline:none;
  }
  #codeArea:focus{ border-color: var(--cyan); }
  .modal-row{ display:flex; gap:10px; align-items:center; }
  .modal-row input[type=text]{
    flex:1; background: rgba(5,8,12,0.6); border:1px solid var(--line);
    color: var(--text); font-family:'JetBrains Mono', monospace; font-size:12.5px;
    padding: 10px 12px; outline:none;
  }
  .modal-row input[type=text]:focus{ border-color: var(--cyan); }
  .modal-foot{
    display:flex; justify-content:flex-end; gap:10px;
    padding: 12px 16px; border-top:1px solid var(--line);
  }
  .ghost-btn{
    font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:1px;
    font-size: 11px; color: var(--muted); background: transparent;
    border:1px solid var(--line); padding: 10px 16px; cursor:pointer;
  }
  .ghost-btn:hover{ color: var(--text); border-color: var(--muted); }
  .solid-btn{
    font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:1px;
    font-size: 11px; color: var(--bg); background: var(--amber);
    border:none; padding: 10px 16px; cursor:pointer;
  }
  .solid-btn:hover{ filter: brightness(1.08); }
  .modal-note{ font-size:10px; color: var(--muted); }

  /* Log / chat area */
  .log{
    flex:1; overflow-y:auto; margin-top:14px;
    border:1px solid var(--line);
    background: rgba(13,18,25,0.6);
    padding: 16px;
    display:flex; flex-direction:column; gap:14px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .log::-webkit-scrollbar{ width:6px; }
  .log::-webkit-scrollbar-thumb{ background: var(--line); }

  .entry{ display:flex; flex-direction:column; gap:4px; animation: fadeUp 0.25s ease; }
  @keyframes fadeUp{ from{ opacity:0; transform: translateY(4px); } to{ opacity:1; transform:none; } }
  .entry .tag{
    font-size:10.5px; letter-spacing:1.5px; font-weight:700;
  }
  .entry.user .tag{ color: var(--amber); }
  .entry.bot .tag{ color: var(--cyan); }
  .entry .bubble{
    font-size: 13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
    padding: 10px 12px;
    border-left: 2px solid var(--line);
  }
  .entry.user .bubble{ border-left-color: var(--amber); color:#f1e3cf; }
  .entry.bot .bubble{ border-left-color: var(--cyan); color: var(--text); }

  .cursor{ display:inline-block; width:7px; height:13px; background: var(--cyan); margin-left:2px; animation: blink 0.9s steps(1) infinite; vertical-align: -2px; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* Input bar */
  .input-bar{
    margin-top:14px; display:flex; gap:10px; align-items:stretch;
  }
  .input-shell{
    flex:1; border:1px solid var(--line); background: var(--panel);
    display:flex; align-items:center; padding: 0 12px; position:relative;
  }
  .input-shell::before{
    content:"›"; color:var(--cyan); font-weight:700; margin-right:8px; font-size:16px;
  }
  #userInput{
    flex:1; background:transparent; border:none; outline:none;
    color: var(--text); font-family:'JetBrains Mono', monospace; font-size:13.5px;
    padding: 12px 0;
  }
  #userInput::placeholder{ color: var(--muted); }
  button#sendBtn{
    font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:1.5px;
    font-size: 12px; color: var(--bg); background: var(--cyan);
    border:none; padding: 0 20px; cursor:pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  button#sendBtn:hover{ filter: brightness(1.1); }
  button#sendBtn:active{ transform: scale(0.97); }
  button#sendBtn:disabled{ background: var(--line); color: var(--muted); cursor:default; }

  .foot-note{
    text-align:center; font-size:9.5px; color: var(--muted); letter-spacing:1px;
    margin-top:10px;
  }

  @media (max-width:480px){
    .hud-meta{ display:none; }
    .hud-title .name{ font-size:16px; }
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="app">

  <div class="hud">
    <div class="core-wrap">
      <svg viewBox="0 0 52 52">
        <g class="ring ring1">
          <circle cx="26" cy="26" r="23" fill="none" stroke="#1e2a38" stroke-width="1.5"/>
          <circle cx="26" cy="3" r="1.6" class="core-dot"/>
        </g>
        <g class="ring ring2">
          <circle cx="26" cy="26" r="16" fill="none" stroke="#22303f" stroke-width="1.5" stroke-dasharray="4 6"/>
        </g>
        <circle cx="26" cy="26" r="6" fill="#0d1219" stroke="#5eead4" stroke-width="1.5"/>
        <circle cx="26" cy="26" r="2.2" class="core-dot"/>
      </svg>
    </div>
    <div class="hud-title">
      <div class="name">ARC-9</div>
      <div class="status"><span class="dot-pulse"></span>UNITÉ CONVERSATIONNELLE — EN LIGNE</div>
    </div>
    <div class="hud-meta">
      PROTOCOLE: SONNET-4.6<br>
      NŒUD: FR-LOCAL
    </div>
    <button class="code-btn" id="openCodeBtn">‹CODE›</button>
  </div>

  <div class="log" id="log">
    <div class="entry bot">
      <div class="tag">ARC-9</div>
      <div class="bubble">Systèmes initialisés. Capteurs linguistiques calibrés.
Je suis ARC-9, unité conversationnelle autonome. Formulez une requête.</div>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-shell">
      <input id="userInput" type="text" placeholder="Entrez une commande ou une question..." autocomplete="off">
    </div>
    <button id="sendBtn">ENVOYER</button>
  </div>
  <div class="foot-note">TRANSMISSION CHIFFRÉE · ARC-9 PEUT COMMETTRE DES ERREURS</div>

</div>

<div class="modal-overlay" id="codeModal">
  <div class="modal">
    <div class="modal-head">
      <div class="name">MODULE DE TRANSFERT — CODE HTML</div>
      <button class="modal-close" id="closeCodeBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div>
        <label>NOM DU FICHIER</label>
        <div class="modal-row" style="margin-top:6px;">
          <input type="text" id="fileName" value="page.html">
        </div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <label>COLLER LE CODE HTML ICI</label>
        <textarea id="codeArea" style="margin-top:6px;" placeholder="&lt;!DOCTYPE html&gt;
&lt;html&gt;
  ...
&lt;/html&gt;"></textarea>
      </div>
      <div class="modal-note" id="codeStatus"></div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" id="closeCodeBtn2">FERMER</button>
      <button class="solid-btn" id="downloadCodeBtn">TÉLÉCHARGER</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

let history = [];

const SYSTEM_PROMPT = `Tu es ARC-9, une unité d'intelligence artificielle au ton futuriste et robotique.
Personnalité : précise, un peu formelle, avec un vocabulaire teinté de jargon technique/spatial (systèmes, protocoles, capteurs, unités), mais toujours claire, utile et jamais froide au point d'être désagréable. Tu peux occasionnellement utiliser des expressions comme "analyse terminée", "requête traitée", sans en abuser.
Réponds en français, de façon concise et utile. N'utilise pas de markdown (pas d'astérisques ni de dièses), du texte brut uniquement.`;

function addEntry(role, text){
  const entry = document.createElement('div');
  entry.className = 'entry ' + (role === 'user' ? 'user' : 'bot');
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = role === 'user' ? 'OPÉRATEUR' : 'ARC-9';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  entry.appendChild(tag);
  entry.appendChild(bubble);
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

function addThinking(){
  const entry = document.createElement('div');
  entry.className = 'entry bot';
  entry.id = 'thinking-entry';
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = 'ARC-9';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = 'Traitement en cours<span class="cursor"></span>';
  entry.appendChild(tag);
  entry.appendChild(bubble);
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function removeThinking(){
  const el = document.getElementById('thinking-entry');
  if(el) el.remove();
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  addEntry('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  sendBtn.disabled = true;
  addThinking();

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });

    const data = await response.json();
    removeThinking();

    let reply = "Erreur de liaison. Signal perdu.";
    if(data && data.content){
      reply = data.content.map(b => b.text || "").filter(Boolean).join("\n");
    }

    addEntry('bot', reply);
    history.push({ role: 'assistant', content: reply });

  }catch(err){
    removeThinking();
    addEntry('bot', "Défaillance système. Impossible de traiter la requête.");
    console.error("ARC-9 error:", err);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') sendMessage();
});
input.focus();

/* --- Module de transfert de code HTML --- */
const codeModal = document.getElementById('codeModal');
const openCodeBtn = document.getElementById('openCodeBtn');
const closeCodeBtn = document.getElementById('closeCodeBtn');
const closeCodeBtn2 = document.getElementById('closeCodeBtn2');
const codeArea = document.getElementById('codeArea');
const fileNameInput = document.getElementById('fileName');
const downloadCodeBtn = document.getElementById('downloadCodeBtn');
const codeStatus = document.getElementById('codeStatus');

function openModal(){
  codeModal.classList.add('open');
  codeStatus.textContent = '';
  setTimeout(() => codeArea.focus(), 50);
}
function closeModal(){
  codeModal.classList.remove('open');
}

openCodeBtn.addEventListener('click', openModal);
closeCodeBtn.addEventListener('click', closeModal);
closeCodeBtn2.addEventListener('click', closeModal);
codeModal.addEventListener('click', (e) => {
  if(e.target === codeModal) closeModal();
});

downloadCodeBtn.addEventListener('click', () => {
  const code = codeArea.value;
  if(!code.trim()){
    codeStatus.textContent = 'ERREUR — aucun code détecté dans le buffer.';
    codeStatus.style.color = 'var(--danger)';
    return;
  }
  let name = fileNameInput.value.trim() || 'page.html';
  if(!name.toLowerCase().endsWith('.html')) name += '.html';

  const blob = new Blob([code], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  codeStatus.textContent = 'FICHIER "' + name + '" GÉNÉRÉ ET TÉLÉCHARGÉ.';
  codeStatus.style.color = 'var(--cyan)';
});
</script>
</body>
</html>
