<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091426">
  <title>WINDOWS 12 ULTIMATE</title>
  <link rel="stylesheet" href="web.css">
</head>
<body>
  <main id="desktop" class="desktop">
    <header class="desktop-heading">
      <div class="system-chip">W12 <span>ULTIMATE</span></div>
      <div id="desktop-user" class="desktop-user"></div>
    </header>
    <section id="desktop-icons" class="desktop-icons" aria-label="Applications"></section>
    <section id="windows" class="windows" aria-live="polite"></section>
    <aside id="start-menu" class="start-menu hidden"></aside>
    <div id="notice" class="notice hidden" role="status"></div>
    <footer class="taskbar">
      <button id="start-button" class="start-button" type="button">◈ <span>Démarrer</span></button>
      <nav id="task-apps" class="task-apps" aria-label="Fenêtres ouvertes"></nav>
      <div class="task-right"><span id="task-user"></span><time id="clock"></time></div>
    </footer>
  </main>
  <script src="web-app.js"></script>
</body>
</html>
